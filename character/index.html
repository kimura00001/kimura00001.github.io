<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://platform.twitter.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://platform.twitter.com https://syndication.twitter.com; connect-src 'self'; base-uri 'none'; form-action 'none'">

<meta name="description" content="ゆるいキャラクターたちが暮らす、すこし暗い世界の話。">
<meta property="og:title" content="作品タイトル｜公式サイト">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121116'/%3E%3Cellipse cx='16' cy='18' rx='11' ry='12' fill='%23e9e4da'/%3E%3Cellipse cx='12' cy='16' rx='2.6' ry='3.6' fill='%23121116'/%3E%3Cellipse cx='20' cy='16' rx='2.6' ry='3.6' fill='%23121116'/%3E%3C/svg%3E">

<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- キャラクターの絵。characters.json の "art" にここの id を書くと表示される -->
<svg class="sprite" aria-hidden="true">
  <!-- メインキャラ：表情のない、白いゆるキャラ -->
  <symbol id="main" viewBox="0 0 240 260">
    <g stroke="#121116" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- antenna -->
      <path d="M120 44 C118 26 128 18 136 14" fill="none"/>
      <circle cx="138" cy="13" r="6" fill="#b3362f"/>
      <!-- legs -->
      <path d="M92 224 L92 250 L80 252 M148 224 L148 250 L160 252" fill="none"/>
      <!-- body -->
      <path d="M120 42 C182 42 206 92 204 146 C202 200 170 232 120 232 C70 232 38 200 36 146 C34 92 58 42 120 42 Z" fill="#e9e4da"/>
      <path d="M50 186 C66 222 100 232 120 232 C150 232 180 220 194 186 C170 208 76 210 50 186 Z" fill="#b9b2a8" stroke="none" opacity=".6"/>
      <!-- arms: だらんと下がっている -->
      <path d="M40 150 C28 170 26 196 32 210" fill="none"/>
      <path d="M200 150 C212 170 214 196 208 210" fill="none"/>
      <!-- eyes: まっくろな穴の中に、小さな光 -->
      <g class="eye">
        <ellipse cx="92" cy="122" rx="15" ry="22" fill="#121116"/>
        <g class="pupil"><circle cx="92" cy="122" r="3.2" fill="#e9e4da" stroke="none"/></g>
      </g>
      <g class="eye">
        <ellipse cx="148" cy="122" rx="15" ry="22" fill="#121116"/>
        <g class="pupil"><circle cx="148" cy="122" r="3.2" fill="#e9e4da" stroke="none"/></g>
      </g>
      <!-- mouth -->
      <path d="M112 170 L128 170" fill="none" stroke-width="3.5"/>
    </g>
  </symbol>

  <!-- サブキャラA：つるされた、てるてる坊主 -->
  <symbol id="sub-a" viewBox="0 0 240 260">
    <g stroke="#121116" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M120 0 L120 54" fill="none" stroke="#8a8494"/>
      <circle cx="120" cy="96" r="44" fill="#e9e4da"/>
      <path d="M86 128 C64 170 54 214 48 240 C80 226 100 248 120 232 C140 248 160 226 192 240 C186 214 176 170 154 128 Z" fill="#e9e4da"/>
      <path d="M84 132 C100 142 140 142 156 132" fill="none" stroke="#b3362f" stroke-width="6"/>
      <circle cx="104" cy="94" r="5" fill="#121116" stroke="none"/>
      <circle cx="136" cy="94" r="5" fill="#121116" stroke="none"/>
      <path d="M114 114 L126 114" fill="none" stroke-width="3"/>
    </g>
  </symbol>

  <!-- サブキャラB：背の高い、となりの人 -->
  <symbol id="sub-b" viewBox="0 0 240 260">
    <g stroke="#121116" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M96 100 C90 160 86 220 84 258 L156 258 C154 220 150 160 144 100 Z" fill="#3a3646"/>
      <ellipse cx="120" cy="66" rx="40" ry="54" fill="#3a3646"/>
      <ellipse cx="120" cy="62" rx="26" ry="30" fill="#e9e4da"/>
      <circle cx="110" cy="58" r="3.5" fill="#121116" stroke="none"/>
      <circle cx="130" cy="58" r="3.5" fill="#121116" stroke="none"/>
      <path d="M108 74 C116 80 124 80 132 74" fill="none" stroke-width="2.5"/>
      <path d="M96 120 C70 170 66 210 70 236 M144 120 C170 170 174 210 170 236" fill="none" stroke="#3a3646" stroke-width="10"/>
    </g>
  </symbol>

  <symbol id="ico-x" viewBox="0 0 24 24"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></symbol>
  <symbol id="ico-pixiv" viewBox="0 0 24 24"><path fill="currentColor" d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm4 4v12h2.4v-3.6h2.4c2.6 0 4.4-1.6 4.4-4.2S15.4 6 12.8 6H8Zm2.4 2.1h2.2c1.3 0 2.1.8 2.1 2.1s-.8 2.1-2.1 2.1h-2.2V8.1Z"/></symbol>
  <symbol id="ico-instagram" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></symbol>
  <symbol id="ico-youtube" viewBox="0 0 24 24"><path fill="currentColor" d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1c.4-1.2.4-3.8.4-3.8s0-2.6-.4-3.8ZM10 15.2V8.8l5.2 3.2-5.2 3.2Z"/></symbol>
  <symbol id="ico-shop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 8h16l-1.2 12H5.2L4 8Zm4 0a4 4 0 0 1 8 0"/></symbol>
  <symbol id="ico-stamp" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 4h14a1 1 0 0 1 1 1v9l-6 6H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm9 16v-5a1 1 0 0 1 1-1h5"/><circle cx="9.5" cy="10" r="1.2" fill="currentColor"/><circle cx="14.5" cy="10" r="1.2" fill="currentColor"/></symbol>
  <symbol id="ico-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="ico-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.5-9.3C1 8.1 3.4 4 7.2 4c2 0 3.6 1.1 4.8 2.7C13.2 5.1 14.8 4 16.8 4c3.8 0 6.2 4.1 4.7 7.7C19.5 16.4 12 21 12 21Z"/></symbol>
  <symbol id="ico-repost" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 9V7a2 2 0 0 1 2-2h12l-3-3m5 13v2a2 2 0 0 1-2 2H6l3 3"/></symbol>
</svg>

  <a href="#top" class="nav-logo"><span data-bind="title">作品タイトル</span></a>

<header class="hero" id="top">
  <div class="hero-bg" aria-hidden="true"><div class="hero-light"></div></div>
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="hero-kicker" data-bind="kicker">ゆるくて くらい まんが</p>
      <h1 class="hero-title"><span data-bind="title">作品タイトル</span></h1>
      <p class="hero-catch" data-bind="catch">ここは、ずっと よるです。</p>
      <p class="hero-lead" data-bind="lead"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" data-href="latestUrl" href="#episodes" target="_blank" rel="noopener"><span data-bind="latestLabel">最新話を読む</span></a>
        <a class="btn btn-ghost" href="#characters">キャラクター</a>
      </div>
      <p class="hero-schedule"><span class="dot" aria-hidden="true"></span><span data-bind="schedule"></span></p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="hero-shadow"></div>
      <svg class="hero-chara" data-watch><use href="#main"/></svg>
    </div>
  </div>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" data-module="ticker"></div></div>
</header>

<main id="main-content">
  <section class="section" id="news">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">NEWS</span>おしらせ</h2>
      <div data-module="news"></div>
    </div>
  </section>

  <section class="section section-alt" id="episodes">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">EPISODES</span>よむ</h2>
      <p class="section-lead">Xで毎週1話ずつ更新しています。どこから読んでも、だいたい同じ夜です。</p>
      <div data-module="episodes"></div>
    </div>
  </section>

  <section class="section" id="characters">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">CHARACTERS</span>キャラクター</h2>
      <div data-module="characters"></div>
    </div>
  </section>

  <section class="section section-alt" id="books">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">BOOKS</span>単行本</h2>
      <div data-module="books"></div>
    </div>
  </section>

  <section class="section" id="posts">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">POSTS</span>さいきんの投稿</h2>
      <div data-module="posts"></div>
    </div>
  </section>

  <section class="section section-alt" id="links">
    <div class="wrap">
      <h2 class="h2"><span class="h2-en">LINKS</span>リンク</h2>
      <div data-module="links"></div>
      <div class="author">
        <svg class="author-icon" aria-hidden="true"><use href="#main"/></svg>
        <div>
          <p class="author-label">AUTHOR</p>
          <p class="author-name" data-bind="author"></p>
          <p class="author-bio" data-bind="authorBio"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p class="footer-whisper" aria-hidden="true">まだ いますか？</p>
  <p class="footer-copy" data-bind="copyright"></p>
  <p class="footer-note">このサイトはデモです。</p>
</footer>

<div class="peek" aria-hidden="true"></div>
